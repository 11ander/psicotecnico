<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login – Psicotécnico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand fw-semibold">Psicotécnico Conducción</span>
  </div>
</nav>

<main class="py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="card-title mb-3">Login</h5>
            <p class="text-muted">
              Pulsa <span class="badge bg-primary">Login</span> y mírate a la cámara del robot.
              Si te reconoce, iniciarás sesión automáticamente.
            </p>

            <div class="d-flex align-items-center gap-3">
              <button id="btnLogin" class="btn btn-primary px-4">Login</button>
              <div id="spinner" class="spinner-border text-secondary d-none" role="status" aria-hidden="true"></div>
              <span id="msg" class="small text-muted"></span>
            </div>

            <div class="mt-3 small text-muted">
              Asegúrate de que el servidor de reconocimiento facial está corriendo.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="py-4 border-top">
  <div class="container text-center text-muted small">
    &copy; 2025 SVP Aerospace – Interfaz de pruebas psicotécnicas
  </div>
</footer>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  crossorigin="anonymous">
</script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
