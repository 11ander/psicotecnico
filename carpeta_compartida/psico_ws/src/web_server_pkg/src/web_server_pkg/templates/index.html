<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Psicotécnico – Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">Psicotécnico Conducción</a>
    <div class="d-flex gap-2 align-items-center">
      <span class="navbar-text text-white-50 small" id="userBadge"></span>
      <a class="btn btn-outline-warning btn-sm" href="{{ url_for('admin_panel') }}">Admin</a>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Cerrar sesión</a>
    </div>

  </div>
</nav>

<main class="py-4">
  <div class="container">

    <div class="row g-4">
      <!-- Selección y cola (estilo compi) -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body">
            <h5 class="card-title mb-3">Selecciona el orden de las pruebas</h5>

            <div class="d-flex flex-wrap gap-2 mb-2">
              <button class="btn btn-outline-secondary btn-sm" onclick="addTest('reflejos')">➕ Reflejos</button>
              <button class="btn btn-outline-secondary btn-sm" onclick="addTest('memoria')">➕ Memoria</button>
              <button class="btn btn-outline-secondary btn-sm" onclick="addTest('audicion')">➕ Audición</button>
              <button class="btn btn-outline-secondary btn-sm" onclick="addTest('coordinacion')">➕ Coordinacion</button>
            </div>

            <ul id="queueList" class="list-group"></ul>

            <div class="d-flex gap-2 mt-3">
              <button id="btnStart" class="btn btn-primary px-4" disabled>Empezar</button>
              <button id="btnClear" class="btn btn-outline-secondary">Vaciar</button>
            </div>

            <div id="runState" class="mt-4 d-none">
              <div id="runBanner" class="alert alert-info d-flex align-items-center" role="alert">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                <div><span id="runLabel">Ejecutando…</span> <span id="runHint" class="fw-semibold"></span></div>
              </div>
              <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                <div id="progressBar" class="progress-bar" style="width: 0%">0%</div>
              </div>
              <ul id="logList" class="list-group list-group-flush mt-3 small"></ul>
            </div>
          </div>
        </div>
      </div>

      <!-- Resultados e histórico -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="card-title mb-0">Resultados de <span id="ownerName" class="fw-bold"></span></h5>
              <button id="btnDownload" class="btn btn-sm btn-outline-success d-none" onclick="window.open('/report/latest','_blank')">Descargar PDF</button>
            </div>
            <ul id="results" class="list-group mt-3"></ul>
          </div>
        </div>



        

      </div>
    </div>

  </div>
</main>

<footer class="py-4 border-top">
  <div class="container text-center text-muted small">
    &copy; 2025 KT Team – Interfaz de pruebas psicotécnicas - Universidad Deusto
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
